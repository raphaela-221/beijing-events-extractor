<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京大事件 · 月历视图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
/* ===== Warm Event Feed v3: semantic topic spectrum, Phosphor icons ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FFFAF6;
  --surface: #FFF3EA;
  --surface-hover: #FFEADC;
  --surface-press: #FFE0CC;
  --text: #3D2E28;
  --text-2: #6B5A51;
  --muted: #9A8A80;
  --faint: #CFC0B8;
  --border: #F3E5DB;
  --primary: #F97316;
  --primary-hover: #EA580C;
  --primary-soft: rgba(249,115,22,.16);
  --shadow: 0 2px 6px rgba(90,50,35,.05), 0 4px 14px rgba(90,50,35,.07);
  --shadow-hover: 0 6px 18px rgba(90,50,35,.08), 0 10px 28px rgba(90,50,35,.10);
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  --font-display: "Outfit", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;

  /* Topic palette: wider hue spread so adjacent greens/purples are distinguishable */
  [data-topic="中小学假期"]        { --tc: #15803D; --tc-bg: #F0FDF4; }
  [data-topic="体育赛事"]          { --tc: #65A30D; --tc-bg: #F7FEE7; }
  [data-topic="文娱活动"]          { --tc: #0891B2; --tc-bg: #ECFEFF; }
  [data-topic="大型会议和展览"]    { --tc: #4F46E5; --tc-bg: #EEF2FF; }
  [data-topic="高级别政府会议"]    { --tc: #312E81; --tc-bg: #E0E7FF; }
  [data-topic="极端天气及自然灾害"]{ --tc: #B91C1C; --tc-bg: #FEF2F2; }
  [data-topic="节假日节庆"]        { --tc: #F59E0B; --tc-bg: #FFFBEB; }
}
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  line-height: 1.55; font-size: 15px;
}

/* Header - soft, floating, no hard border */
header { padding: 28px 32px 18px; }
.toprow { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
.brand .mark {
  width: 40px; height: 40px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary) 0%, #FDBA74 100%);
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 4px 12px rgba(249,115,22,.28);
}
.brand .mark i.ph { font-size: 22px; line-height: 1; }
.nav button i.ph { font-size: 18px; line-height: 1; }
.modal .close i.ph { font-size: 16px; line-height: 1; }
.brand .name { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.brand .sep { color: var(--faint); font-weight: 300; }
.brand .view { font-size: 13px; color: var(--muted); font-weight: 500; }
.back {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; color: var(--muted); text-decoration: none;
  padding: 6px 10px; border-radius: var(--radius-md); transition: .18s;
}
.back:hover { color: var(--text); background: var(--surface-hover); }
.lang-toggle {
  display: inline-flex; background: var(--surface); border-radius: var(--radius-full);
  padding: 3px; gap: 2px; margin-left: auto; flex: none;
}
.lang-toggle button {
  border: none; background: none; padding: 5px 12px; font-size: 12px; font-weight: 700;
  color: var(--muted); border-radius: var(--radius-full); cursor: pointer; transition: .18s;
}
.lang-toggle button.on { background: #fff; color: var(--text); box-shadow: var(--shadow); }
.nav {
  display: flex; align-items: center; gap: 6px; margin-left: auto;
  background: #fff; padding: 5px; border-radius: var(--radius-full);
  box-shadow: var(--shadow);
}
.nav button {
  background: #fff; border: none; border-radius: var(--radius-full);
  width: 38px; height: 38px; display: grid; place-items: center;
  color: var(--text-2); cursor: pointer; transition: .18s;
}
.nav button:hover { background: var(--surface); transform: scale(1.05); }
.month-label { font-family: var(--font-display); font-size: 18px; font-weight: 700; min-width: 120px; text-align: center; color: var(--text); }
.search { position: relative; }
.search i.ph { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:17px; color:var(--faint); pointer-events:none; line-height:1; }
.search input {
  width: 260px; padding: 11px 16px 11px 40px; border: none; border-radius: var(--radius-full);
  background: #fff; font-size: 14px; color: var(--text); font-family: var(--font-sans);
  box-shadow: var(--shadow);
}
.search input::placeholder { color: var(--faint); }
.search input:focus { box-shadow: 0 0 0 4px var(--primary-soft); outline: none; }

/* Toolbar filters - chunky pills */
.toolbar { padding: 10px 32px 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .lab { font-family: var(--font-display); font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px 8px 12px;
  border-radius: var(--radius-full); font-size: 13px; font-weight: 700; cursor: pointer;
  border: none; background: #fff; color: var(--text-2);
  user-select: none; transition: .18s; box-shadow: var(--shadow);
}
.chip .swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--tc, var(--faint)); }
.chip[data-topic]:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.chip[data-topic]:not(.off) { background: var(--tc-bg); color: var(--tc); }
.chip.off { opacity: .5; background: #fff; color: var(--faint); }
.chip.off .swatch { background: var(--faint); }

/* Calendar - floating rounded tiles, no hard grid lines */
main { padding: 10px 32px 48px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.dow {
  padding: 10px 8px; text-align: left; font-family: var(--font-display);
  font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .02em;
}
.dow.weekend { color: var(--primary); }
.day {
  background: #fff; min-height: 128px; padding: 12px;
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  border: 1px solid var(--border);
  position: relative; transition: .2s;
}
.day.empty { background: var(--surface); box-shadow: none; opacity: .75; }
.day:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); border-color: #EAD5C8; }
.day-num { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.day.today { background: #fff; box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow); }
.day.today .day-num { color: var(--primary); }
.events { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.evt {
  font-size: 11.5px; padding: 6px 11px; border-radius: var(--radius-full);
  background: var(--tc-bg); color: var(--tc);
  cursor: pointer; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: .18s; font-weight: 700;
}
.evt:hover { filter: brightness(.97); transform: translateX(3px); }
.more { font-size: 12px; color: var(--muted); cursor: pointer; padding-left: 8px; font-weight: 700; }
.more:hover { color: var(--primary); text-decoration: underline; }
.legend { display: flex; gap: 20px; margin-top: 22px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 5px; }
.legend .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(61,46,40,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 24px; backdrop-filter: blur(3px); }
.modal-bg.show { display: flex; }
.modal { background: var(--bg); border-radius: var(--radius-xl); max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 30px; position: relative; box-shadow: 0 28px 70px rgba(61,46,40,.2); }
.modal .close { position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border: none; border-radius: var(--radius-full); background: #fff; cursor: pointer; color: var(--muted); display: grid; place-items: center; transition: .18s; box-shadow: var(--shadow); }
.modal .close:hover { color: var(--text); background: var(--surface); transform: scale(1.05); }
.modal .topic-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: var(--radius-full); font-size: 12px; font-weight: 700; margin-bottom: 16px; background: var(--tc-bg); color: var(--tc); }
.modal .topic-badge .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.modal h2 { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.25; margin-bottom: 14px; letter-spacing: -.01em; }
.modal .meta { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); }
.modal .meta .dur { font-family: var(--font-sans); padding: 4px 12px; background: #fff; border-radius: var(--radius-full); font-size: 11px; color: var(--text-2); font-weight: 700; box-shadow: var(--shadow); }
.modal .desc { font-size: 15px; line-height: 1.75; color: var(--text-2); margin-bottom: 18px; }
.modal .sect-lab { font-family: var(--font-display); font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.modal .kw { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
.modal .kw .k { font-size: 12px; padding: 5px 12px; background: #fff; border-radius: var(--radius-full); color: var(--text-2); font-weight: 600; box-shadow: var(--shadow); }
.modal .kw.en .k { font-style: italic; }
.modal .link { font-size: 13px; color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--primary-soft); padding-bottom: 1px; transition: .12s; font-weight: 700; }
.modal .link:hover { color: var(--primary-hover); border-color: var(--primary-hover); }
.modal .day-list { display: flex; flex-direction: column; gap: 10px; }
.modal .day-list .item { padding: 14px; background: #fff; border-radius: var(--radius-md); cursor: pointer; transition: .18s; box-shadow: var(--shadow); }
.modal .day-list .item:hover { background: var(--surface-hover); transform: translateX(3px); box-shadow: var(--shadow-hover); }
.modal .day-list .item .top { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
.modal .day-list .item .top .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.modal .day-list .item .ti { font-size: 14px; color: var(--text); font-weight: 700; }

@media (max-width: 760px) {
  header, .toolbar { padding-left: 16px; padding-right: 16px; }
  main { padding: 16px; }
  .search input { width: 100%; }
  .grid { gap: 8px; }
  .day { min-height: 96px; padding: 10px; border-radius: var(--radius-md); }
  .chip { padding: 7px 12px 7px 10px; font-size: 12px; }
}

/* 事件悬停卡片（与时间轴共用 .g-tip 类，fixed 定位规避 overflow 裁剪）*/
.g-tip {
  position: fixed; z-index: 1000; pointer-events: none; max-width: 320px;
  background: #fff; color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 10px 12px; box-shadow: var(--shadow-hover);
  font-size: 12px; line-height: 1.5;
  opacity: 0; transform: translateY(4px);
  transition: opacity .12s ease, transform .12s ease;
}
.g-tip.show { opacity: 1; transform: translateY(0); }
.g-tip .tt-topic { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); margin-bottom: 5px; }
.g-tip .tt-topic .swatch { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); flex: none; }
.g-tip .tt-head { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 4px; word-break: break-word; }
.g-tip .tt-date { color: var(--text-2); font-size: 11px; }
.g-tip .tt-kw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.g-tip .tt-kw .k { background: var(--surface); color: var(--text-2); border-radius: var(--radius-full); padding: 2px 8px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <a class="brand" href="index.html">
      <span class="mark"><i class="ph-fill ph-fire"></i></span>
      <span class="name">北京大事件</span><span class="sep">/</span><span class="view" data-i18n="viewMonth">月历视图</span>
    </a>
    <a class="back" href="index.html"><i class="ph ph-arrow-left"></i> <span data-i18n="backToOverview">返回总览</span></a>
    <div class="nav">
      <button id="prev" aria-label=""><i class="ph ph-caret-left"></i></button>
      <span class="month-label" id="label"></span>
      <button id="next" aria-label=""><i class="ph ph-caret-right"></i></button>
    </div>
    <div class="search">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search" placeholder="" aria-label="">
    </div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="zh" class="on">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>
<div class="toolbar" id="filters"><span class="lab">类型</span></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>
</main>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script src="events_data.js"></script>
<script src="common.js"></script>
<script>
const init = computeInitialMonth(window.EVENTS || []);
const state = { y: init.y, m: init.m, topics: new Set(Object.keys(TOPIC_COLORS)), q: "" };
const urlLang=new URLSearchParams(location.search).get('lang');
if(urlLang==='en'||urlLang==='zh') setLang(urlLang);
else setLang(getLang());

function filtered() { return filterEvents(window.EVENTS||[], state.topics, state.q); }

function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    const text=t(key);
    if(text!==key) el.textContent=text;
  });
  document.getElementById('search').placeholder=t('searchPlaceholder');
  document.getElementById('prev').setAttribute('aria-label',t('prevMonth'));
  document.getElementById('next').setAttribute('aria-label',t('nextMonth'));
}
function updateLangToggle(){
  const l=getLang();
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
}

function renderFiltersCustom() {
  renderFilters('filters', state.topics, () => { renderFiltersCustom(); renderGrid(); applyStaticI18n(); });
}
function renderLegend() {
  const l = document.getElementById("legend");
  l.innerHTML = "";
  Object.keys(TOPIC_COLORS).forEach(t => {
    const it = document.createElement("div");
    it.className = "item";
    it.innerHTML = `<span class="dot" data-topic="${t}"></span>${t}`;
    l.appendChild(it);
  });
}
function renderGrid() {
  hideEventTip();
  const isEn = getLang() === 'en';
  document.getElementById("label").textContent = isEn
    ? `${new Date(state.y, state.m).toLocaleString('en-US',{month:'long',year:'numeric'})}`
    : `${state.y}年${state.m+1}月`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  DOW.forEach(([d, wk]) => { const c = document.createElement("div"); c.className = "dow" + (wk ? " weekend" : ""); c.textContent = d; grid.appendChild(c); });
  const first = new Date(state.y, state.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(state.y, state.m + 1, 0).getDate();
  const evts = filtered();
  const today = stripTime(new Date());
  for (let i = 0; i < offset; i++) { const c = document.createElement("div"); c.className = "day empty"; grid.appendChild(c); }
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement("div");
    const date = stripTime(new Date(state.y, state.m, d));
    cell.className = "day" + (date.getTime() === today.getTime() ? " today" : "");
    const num = document.createElement("div"); num.className = "day-num"; num.textContent = d; cell.appendChild(num);
    const evCont = document.createElement("div"); evCont.className = "events";
    const dayEvts = evts.filter(e => eventOnDay(e, date));
    dayEvts.slice(0, 4).forEach(e => {
      const el = document.createElement("div");
      el.className = "evt"; el.dataset.topic = e.topic_zh; el.dataset.no = e.no;
      const label = shortLabel(e, getLang());
      el.textContent = label; el.title = eventLabel(e, getLang(), 3) || e.headline; el.onclick = () => openModal(e);
      evCont.appendChild(el);
    });
    if (dayEvts.length > 4) {
      const more = document.createElement("div");
      more.className = "more"; more.textContent = `+${dayEvts.length - 4} 更多`;
      more.onclick = () => { state.q = ""; document.getElementById("search").value = ""; openDayList(dayEvts); };
      evCont.appendChild(more);
    }
    cell.appendChild(evCont); grid.appendChild(cell);
  }
  const total = offset + daysInMonth;
  const trailing = (7 - (total % 7)) % 7;
  for (let i = 0; i < trailing; i++) { const c = document.createElement("div"); c.className = "day empty"; grid.appendChild(c); }
}
function closeModal() { document.getElementById("modalBg").classList.remove("show"); }
function openDayList(evts) {
  const m = document.getElementById("modal");
  m.innerHTML = `<button class="close" onclick="closeModal()" aria-label="${t('close')}">${ICONS.close}</button>
    <h2>${t('eventCount').replace('%n',evts.length)}</h2>
    <div class="day-list">${evts.map(e => `<div class="item" data-topic="${e.topic_zh}" onclick="openModal(EVENTS.find(x=>x.no===${e.no}))">
      <div class="top"><span class="swatch"></span>${topicName(e.topic_zh)}${topicSubtag(e, getLang()) ? ` · ${topicSubtag(e, getLang())}` : ""} · ${e.start}</div>
      <div class="ti">${esc(eventLabel(e, getLang(), 2))}</div></div>`).join("")}</div>`;
  document.getElementById("modalBg").classList.add("show");
}
function openModal(e) {
  if (!e) return;
  const m = document.getElementById("modal");
  const multi = e.start !== e.end;
  const days = Math.round((stripTime(parseDate(e.end)) - stripTime(parseDate(e.start))) / 86400000) + 1;
  const startLabel = fmtDateL(parseDate(e.start), getLang());
  const endLabel = fmtDateL(parseDate(e.end), getLang());
  m.innerHTML = `
    <button class="close" onclick="closeModal()" aria-label="${t('close')}">${ICONS.close}</button>
    <div class="topic-badge" data-topic="${e.topic_zh}"><span class="swatch"></span>${e.topic_zh}${e.topic_en ? ` · ${esc(e.topic_en)}` : ""}${topicSubtag(e, getLang()) ? ` · ${esc(topicSubtag(e, getLang()))}` : ""}</div>
    <h2>${esc(e.headline)}</h2>
    <div class="meta">${startLabel}${multi ? ` → ${endLabel}` : ""}${multi ? `<span class="dur">${days} ${t('dayUnit')}</span>` : ""}</div>
    ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
    ${e.keywords_zh ? `<div class="sect-lab">${t('keywords')}</div><div class="kw">${kwPills(e.keywords_zh)}</div>` : ""}
    ${e.keywords_en ? `<div class="sect-lab">${t('keywordsEn')}</div><div class="kw en">${kwPills(e.keywords_en)}</div>` : ""}
    ${e.link ? `<a class="link" href="${esc(e.link)}" target="_blank" rel="noopener">${t('viewSource')} ↗</a>` : ""}
  `;
  document.getElementById("modalBg").classList.add("show");
}
document.getElementById("modalBg").onclick = ev => { if (ev.target.id === "modalBg") closeModal(); };
function prevMonth(){ state.m--; if (state.m < 0) { state.m = 11; state.y--; } renderGrid(); }
function nextMonth(){ state.m++; if (state.m > 11) { state.m = 0; state.y++; } renderGrid(); }
document.getElementById("prev").onclick = prevMonth;
document.getElementById("next").onclick = nextMonth;
mountMonthPicker({labelId:'label',getYM:()=>[state.y,state.m],setYM:(y,m)=>{state.y=y;state.m=m;},render:renderGrid});
document.getElementById("search").oninput = ev => { state.q = ev.target.value; renderGrid(); };
document.getElementById("langToggle").onclick = ev => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  setLang(btn.dataset.lang);
  renderFiltersCustom();
  renderGrid();
  applyStaticI18n();
  updateLangToggle();
};
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeModal();
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (ev.key === "ArrowLeft") prevMonth();
  else if (ev.key === "ArrowRight") nextMonth();
});
bindEventTip(document.getElementById('grid'), '.evt');
renderFiltersCustom(); renderLegend(); renderGrid(); applyStaticI18n(); updateLangToggle();
</script>
</body>
</html>
