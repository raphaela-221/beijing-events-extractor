<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京大事件 · 整合总览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="calendar.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <a class="brand" href="index.html">
      <span class="mark"><i class="ph-fill ph-fire"></i></span>
      <span class="name">北京大事件</span><span class="sep">/</span><span class="view" data-i18n="viewOverview">整合总览</span>
    </a>
    <div class="search">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search" placeholder="" aria-label="搜索">
    </div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="zh" class="on">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
  <div class="toolbar" id="filters"><span class="lab">类型</span></div>
</header>
<main>
  <div class="dash">
    <div class="signal-grid" id="signals"></div>

    <div class="theme-panel" id="themePanel"></div>

    <div class="view-cards">
      <a class="view-card" href="month.html">
        <div class="ico"><i class="ph ph-calendar-blank"></i></div>
        <h3 data-i18n="viewMonth">月历视图</h3>
        <p data-i18n="viewMonthDesc">整月日历网格，每天显示事件色块，一眼看清「哪天有 High 事件」。</p>
        <span class="tag"><span data-i18n="openMonthView">打开月历</span> <i class="ph ph-caret-right"></i></span>
      </a>
      <a class="view-card" href="timeline.html">
        <div class="ico"><i class="ph ph-chart-bar-horizontal"></i></div>
        <h3 data-i18n="viewTimeline">时间轴视图</h3>
        <p data-i18n="viewTimelineDesc">每条事件横条跨开始–结束日，按类型分泳道，擅长看持续期和重叠。</p>
        <span class="tag"><span data-i18n="openTimelineView">打开时间轴</span> <i class="ph ph-caret-right"></i></span>
      </a>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="nav">
          <button class="nav-btn" id="prev" aria-label=""><i class="ph ph-caret-left"></i></button>
          <span class="nav-label" id="lbl"></span>
          <button class="nav-btn" id="next" aria-label=""><span data-i18n="nextMonthLabel">下月</span><i class="ph ph-caret-right"></i></button>
        </div>
      </div>
      <div id="leftBody"></div>
      <div class="dist" id="dist"></div>
      <div class="highlights" id="highlights"></div>
    </div>

    <div class="panel">
      <div class="export-bar">
        <button class="export-btn" id="exportZh"><i class="ph ph-download-simple"></i> <span data-i18n="exportChinese">导出中文报告</span></button>
        <button class="export-btn" id="exportEn"><i class="ph ph-download-simple"></i> <span data-i18n="exportEnglish">导出英文报告</span></button>
        <button class="export-btn primary" id="exportBoth"><i class="ph ph-download-simple"></i> <span data-i18n="exportBoth">导出中英文报告</span></button>
        <a class="export-btn" href="Events List.xlsx" download title="下载原始 Excel 表格"><i class="ph ph-table"></i> <span data-i18n="downloadRaw">原始数据表格</span></a>
      </div>
      <div class="panel-head"><span class="title" data-i18n="specialAttention">近期特别关注</span></div>
      <div class="watchlist" id="watchlist"></div>
      <div class="panel-head" style="border-top:1px solid var(--border)"><span class="title" data-i18n="upcomingTitle">近期 High 事件</span></div>
      <div class="up" id="upcoming"></div>
    </div>
  </div>
</main>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script src="events_data.js"></script>
<script src="common.js"></script>
<script>
const init=computeInitialMonth(window.EVENTS||[]);
const state={y:init.y,m:init.m,topics:new Set(Object.keys(TOPIC_COLORS)),q:""};
const urlLang=new URLSearchParams(location.search).get('lang');
if(urlLang==='en'||urlLang==='zh') setLang(urlLang);
else setLang(getLang());

function filtered(){return filterEvents(window.EVENTS||[],state.topics,state.q);}

function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    const text=t(key);
    if(text!==key) el.textContent=text;
  });
  document.getElementById('search').placeholder=t('searchPlaceholder');
  document.getElementById('prev').setAttribute('aria-label',t('prevMonth'));
  document.getElementById('next').setAttribute('aria-label',t('nextMonth'));
}

function updateLangToggle(){
  const l=getLang();
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
}

function renderFiltersCustom(){
  renderFilters('filters',state.topics,()=>{renderFiltersCustom();renderAll();});
}

function renderSignals(){
  const evts=filtered();
  const signals=computeSignals(evts,state.y,state.m);
  const container=document.getElementById('signals');
  container.innerHTML=signals.map(s=>{
    const topicsHtml=s.topics.map(t=>`<span class="tp"><span class="dot" style="background:${TOPIC_COLORS[t]}"></span>${esc(topicName(t))}</span>`).join('');
    return `
    <div class="signal-card" data-signal="${s.key}">
      <div class="sig-head">
        <div class="sig-name">${esc(signalName(s))}</div>
        ${trendHtml(s)}
      </div>
      <div class="sig-topics">${topicsHtml}</div>
      <div class="sig-count">${s.count}</div>
    </div>`;
  }).join('');
}

function renderTheme(){
  const theme=getMonthlyTheme(filtered(),state.y,state.m);
  document.getElementById('themePanel').innerHTML=`
    <div class="lab">${t('monthlyTheme')}</div>
    <div class="zh">${esc(theme.zh)}</div>
    <div class="en">${esc(theme.en)}</div>`;
}

function renderWatchlist(){
  const list=getWatchlist(filtered());
  const container=document.getElementById('watchlist');
  if(!list.length){
    container.innerHTML=`<div style="padding:24px;color:var(--muted);text-align:center">${t('noEvents')}</div>`;
    return;
  }
  container.innerHTML=list.map(w=>{
    const e=w.event;
    const multi=e.start!==e.end;
    const topicLabel=(getLang()==='en'?e.topic_en:e.topic_zh)+(topicSubtag(e,getLang())?' · '+topicSubtag(e,getLang()):'');
    return `<div class="watch-item" data-topic="${e.topic_zh}" onclick="openByNo(${e.no})">
      <div class="top"><span class="swatch"></span>${topicLabel}<span style="margin-left:auto">${e.start}${multi?' → '+e.end:''}</span></div>
      <div class="title">${esc(eventLabel(e, getLang(), 2))}</div>
      <div class="badges">${w.badges.map(b=>badgeHtml(b)).join('')}</div>
    </div>`;
  }).join('');
}

function renderLeft(){
  document.getElementById('lbl').textContent=`${state.y}.${state.m+1}`;
  document.getElementById('leftBody').innerHTML=renderMiniGrid();
}

function renderMiniGrid(){
  const first=new Date(state.y,state.m,1);
  const offset=(first.getDay()+6)%7;
  const days=new Date(state.y,state.m+1,0).getDate();
  const evts=filtered();
  const today=stripTime(new Date());
  let h=`<div class="mgrid">`;
  DOW.forEach(([d])=>h+=`<div class="dow">${d}</div>`);
  for(let i=0;i<offset;i++)h+=`<div class="d empty"></div>`;
  for(let d=1;d<=days;d++){
    const date=stripTime(new Date(state.y,state.m,d));
    const de=evts.filter(e=>eventOnDay(e,date));
    const isT=date.getTime()===today.getTime();
    h+=`<div class="d${isT?' today':''}"><div class="dn">${d}</div>${de.length?`<div class="count">${de.length}</div><div class="dots">${de.slice(0,8).map(e=>`<i data-topic="${e.topic_zh}" title="${esc(eventLabel(e, getLang(), 2))}" onclick="openByNo(${e.no})"></i>`).join('')}${de.length>8?`<i style="background:#94a3b8" title="共${de.length}条" onclick="openDayModal(${state.y},${state.m},${d},filtered())"></i>`:''}</div>`:''}</div>`;
  }
  const total=offset+days;const tr=(7-total%7)%7;
  for(let i=0;i<tr;i++)h+=`<div class="d empty"></div>`;
  h+=`</div>`;
  return h;
}

function renderDist(){
  const evts=filtered();
  const monthEvts=eventsInMonth(evts,state.y,state.m);

  function buildSection(data,title){
    if(!data.length){
      return `<div class="dist-section">
        <div class="dist-title">${title}</div>
        <div class="dist-empty">${t('noEvents')}</div>
      </div>`;
    }
    const tc={};
    data.forEach(e=>tc[e.topic_zh]=(tc[e.topic_zh]||0)+1);
    return `
    <div class="dist-section">
      <div class="dist-title">${title}</div>
      <div class="bar">${Object.keys(TOPIC_COLORS).map(t=>{const n=tc[t]||0;return n?`<span data-topic="${t}" style="width:${(n/data.length*100).toFixed(1)}%" title="${topicName(t)}: ${n}"></span>`:'';}).join('')}</div>
      <div class="dist-legend">${Object.keys(TOPIC_COLORS).map(t=>{const n=tc[t]||0;return n?`<div class="it"><span class="d" data-topic="${t}"></span>${topicName(t)} ${n}</div>`:'';}).join('')}</div>
    </div>`;
  }

  const monthTitle=`${t('distMonth')}（${state.y}.${state.m+1} · ${t('dataReference')} ${monthEvts.length} ${t('eventsUnit')}）`;
  const allTitle=`${t('distAll')}（${t('dataReference')} ${evts.length} ${t('eventsUnit')}）`;

  document.getElementById('dist').innerHTML=buildSection(monthEvts,monthTitle)+buildSection(evts,allTitle);
}

function renderUpcoming(){
  const today=stripTime(new Date());
  const evts=filtered();
  const future=evts.filter(e=>stripTime(parseDate(e.start))>=today).sort((a,b)=>a.start.localeCompare(b.start)).slice(0,15);
  const up=document.getElementById('upcoming');
  if(!future.length){up.innerHTML=`<div style="padding:24px;color:var(--muted);text-align:center">${t('noEvents')}</div>`;return;}
  up.innerHTML=future.map(e=>`<div class="uitem" data-topic="${e.topic_zh}" onclick="openByNo(${e.no})"><div class="d"><span class="swatch"></span>${e.start}${e.start!==e.end?' → '+e.end:''}</div><div class="t">${esc(eventLabel(e, getLang(), 2))}</div></div>`).join('');
}

function renderHighlights(){
  const list=getMonthHighlights(filtered(),state.y,state.m);
  const el=document.getElementById('highlights');
  if(!list.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="hl-head"><span class="title">${t('monthHighlights')}</span></div>`+
    list.map(h=>{
      const e=h.event;
      const multi=e.start!==e.end;
      const topicLabel=(getLang()==='en'?e.topic_en:e.topic_zh)+(topicSubtag(e,getLang())?' · '+topicSubtag(e,getLang()):'');
      return `<div class="hitem" data-topic="${e.topic_zh}" onclick="openByNo(${e.no})">
        <div class="top"><span class="swatch"></span>${topicLabel}<span style="margin-left:auto">${e.start}${multi?' → '+e.end:''}</span></div>
        <div class="title">${esc(eventLabel(e, getLang(), 2))}</div>
      </div>`;
    }).join('');
}

function renderAll(){
  applyStaticI18n();
  updateLangToggle();
  renderSignals();
  renderTheme();
  renderWatchlist();
  renderLeft();
  renderDist();
  renderHighlights();
  renderUpcoming();
}

document.getElementById('modalBg').onclick=ev=>{if(ev.target.id==='modalBg')closeModal();};
document.getElementById('search').oninput=ev=>{state.q=ev.target.value;renderAll();};
document.getElementById('prev').onclick=()=>{state.m--;if(state.m<0){state.m=11;state.y--;}renderAll();};
document.getElementById('next').onclick=()=>{state.m++;if(state.m>11){state.m=0;state.y++;}renderAll();};
mountMonthPicker({getYM:()=>[state.y,state.m],setYM:(y,m)=>{state.y=y;state.m=m;},render:renderAll});
document.getElementById('langToggle').onclick=ev=>{
  const btn=ev.target.closest('button');
  if(!btn)return;
  setLang(btn.dataset.lang);
  renderFiltersCustom();
  renderAll();
};
document.getElementById('exportZh').onclick=()=>exportReport(filtered(),state.y,state.m,'zh');
document.getElementById('exportEn').onclick=()=>exportReport(filtered(),state.y,state.m,'en');
document.getElementById('exportBoth').onclick=()=>exportBothReports(filtered(),state.y,state.m);
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')closeModal();
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(ev.key==='ArrowLeft'){state.m--;if(state.m<0){state.m=11;state.y--;}renderAll();}
  else if(ev.key==='ArrowRight'){state.m++;if(state.m>11){state.m=0;state.y++;}renderAll();}
});

renderFiltersCustom();
renderAll();
</script>
</body>
</html>
