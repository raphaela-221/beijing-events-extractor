<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京大事件 · 时间轴视图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="calendar.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <a class="brand" href="index.html">
      <span class="mark"><i class="ph-fill ph-fire"></i></span>
      <span class="name">北京大事件</span><span class="sep">/</span><span class="view" data-i18n="viewTimeline">时间轴视图</span>
    </a>
    <a class="back" href="index.html"><i class="ph ph-arrow-left"></i> <span data-i18n="backToOverview">返回总览</span></a>
    <div class="nav">
      <button class="nav-btn" id="prev" aria-label=""><i class="ph ph-caret-left"></i></button>
      <span class="nav-label" id="lbl"></span>
      <button class="nav-btn" id="next" aria-label=""><span data-i18n="nextMonthLabel">下月</span><i class="ph ph-caret-right"></i></button>
    </div>
    <div class="search">
      <i class="ph ph-magnifying-glass"></i>
      <input id="search" placeholder="" aria-label="">
    </div>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="zh" class="on">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
  <div class="toolbar" id="filters"><span class="lab">类型</span></div>
</header>
<main>
  <div class="hint" id="hint"></div>
  <div class="gantt"><div class="g-scroll"><div class="g-inner" id="gantt"></div></div></div>
</main>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<script src="events_data.js"></script>
<script src="common.js"></script>
<script>
const DAY_W = 30;
const init = computeInitialMonth(window.EVENTS || []);
const state = { y: init.y, m: init.m, months: 2, topics: new Set(Object.keys(TOPIC_COLORS)), q: "" };
const urlLang=new URLSearchParams(location.search).get('lang');
if(urlLang==='en'||urlLang==='zh') setLang(urlLang);
else setLang(getLang());

function filtered(){return filterEvents(window.EVENTS||[],state.topics,state.q);}

function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    const text=t(key);
    if(text!==key) el.textContent=text;
  });
  document.getElementById('search').placeholder=t('searchPlaceholder');
  document.getElementById('prev').setAttribute('aria-label',t('prevMonth'));
  document.getElementById('next').setAttribute('aria-label',t('nextMonth'));
  document.getElementById('hint').innerHTML=t('timelineHint');
}
function updateLangToggle(){
  const l=getLang();
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
}

function renderFiltersCustom(){renderFilters('filters',state.topics,()=>{renderFiltersCustom();renderGantt();applyStaticI18n();});}
const ROW_H = 30;
function assignRows(arr, rStart, rEnd){
  const rows = [];
  const placed = [];
  arr.forEach(e => {
    const es = stripTime(parseDate(e.start)), ee = stripTime(parseDate(e.end));
    const cs = es < rStart ? rStart : es;
    const ce = ee > rEnd ? rEnd : ee;
    const startIdx = Math.round((cs - rStart) / DAY_MS);
    const endIdx = Math.round((ce - rStart) / DAY_MS);
    let row = rows.findIndex(lastEnd => lastEnd < startIdx);
    if (row === -1) { row = rows.length; rows.push(endIdx); }
    else { rows[row] = endIdx; }
    placed.push({ event: e, startIdx, endIdx, row, cutRight: ee > rEnd });
  });
  return placed;
}
function renderGantt(){
  hideEventTip();
  const rStart = stripTime(new Date(state.y, state.m, 1));
  const rEnd = stripTime(new Date(state.y, state.m + state.months, 0));
  const totalDays = Math.round((rEnd - rStart)/DAY_MS) + 1;
  const trackW = totalDays * DAY_W;
  const endMonthDate = new Date(state.y, state.m + state.months, 0);
  const endYear = endMonthDate.getFullYear(), endMonth = endMonthDate.getMonth()+1;
  document.getElementById("lbl").textContent = `${state.y}.${state.m+1} — ${endYear}.${endMonth}`;
  const evts = filtered().filter(e => {
    const s = stripTime(parseDate(e.start)), en = stripTime(parseDate(e.end));
    return en >= rStart && s <= rEnd;
  });
  const byTopic = {};
  Object.keys(TOPIC_COLORS).forEach(t => byTopic[t] = []);
  evts.forEach(e => { if(byTopic[e.topic_zh]) byTopic[e.topic_zh].push(e); });
  Object.values(byTopic).forEach(arr => arr.sort((a,b) => a.start.localeCompare(b.start)));
  const today = stripTime(new Date());
  const todayOffset = (today >= rStart && today <= rEnd) ? Math.round((today - rStart)/DAY_MS) : -1;
  let axisDays = "";
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(rStart.getTime() + i*DAY_MS);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = stripTime(d).getTime() === today.getTime();
    const isMonthStart = d.getDate() === 1 || i === 0;
    axisDays += `<div class="day${isWeekend?" weekend":""}${isToday?" today":""}" style="width:${DAY_W}px">
      ${isMonthStart?`<div class="mo">${d.getMonth()+1}月</div>`:""}
      <div class="num">${d.getDate()}</div></div>`;
  }
  const todayLabel = todayOffset >= 0 ? `<div class="g-today" style="left:${todayOffset*DAY_W}px"><span class="today-label">${esc(t('today'))}</span></div>` : "";
  let html = `<div class="g-axis-row">
    <div class="g-axis-label">${t('ganttAxisLabel')}</div>
    <div class="g-axis" style="width:${trackW}px;">${axisDays}${todayLabel}</div>
  </div>`;
  let hasAny = false;
  Object.keys(TOPIC_COLORS).forEach(t => {
    const arr = byTopic[t];
    if (!arr.length) return;
    hasAny = true;
    const placed = assignRows(arr, rStart, rEnd);
    const rowCount = placed.reduce((m, p) => Math.max(m, p.row + 1), 1);
    const scrolledCls = rowCount > 5 ? " scrolled" : "";
    const todayLine = todayOffset >= 0 ? `<div class="g-today" style="left:${todayOffset*DAY_W}px;"></div>` : "";
    let track = `<div class="g-track${scrolledCls}" style="width:${trackW}px;">${todayLine}`;
    const rows = Array.from({length: rowCount}, () => []);
    placed.forEach(p => rows[p.row].push(p));
    rows.forEach(rowItems => {
      track += `<div class="g-row">`;
      rowItems.forEach(p => {
        const e = p.event;
        const left = p.startIdx * DAY_W;
        const width = (p.endIdx - p.startIdx + 1) * DAY_W;
        const barLabel = shortLabel(e, getLang(), { noTruncate: true });
        const barTitle = eventLabel(e, getLang(), 3) || esc(e.headline);
        track += `<div class="g-bar" data-topic="${e.topic_zh}" data-no="${e.no}" style="left:${left}px;width:${width}px" onclick="openByNo(${e.no})" title="${esc(barTitle)}">${esc(barLabel)}${p.cutRight?" →":""}</div>`;
      });
      track += `</div>`;
    });
    track += `</div>`;
    html += `<div class="g-lane"><div class="g-label" data-topic="${t}"><span class="swatch"></span>${topicName(t)} <span class="cnt">${arr.length}</span></div>${track}</div>`;
  });
  if (!hasAny) html += `<div class="empty-lane">${t('ganttEmpty')}</div>`;
  document.getElementById("gantt").innerHTML = html;
}
/* 条形悬停卡片：逻辑见 common.js bindEventTip（月历/时间轴共用）*/
bindEventTip(document.getElementById('gantt'), '.g-bar');
document.getElementById("modalBg").onclick=ev=>{if(ev.target.id==="modalBg")closeModal();};
function prevMonth(){state.m--;if(state.m<0){state.m=11;state.y--;}renderGantt();}
function nextMonth(){state.m++;if(state.m>11){state.m=0;state.y++;}renderGantt();}
document.getElementById("prev").onclick=prevMonth;
document.getElementById("next").onclick=nextMonth;
mountMonthPicker({getYM:()=>[state.y,state.m],setYM:(y,m)=>{state.y=y;state.m=m;},render:renderGantt});
document.getElementById("search").oninput=ev=>{state.q=ev.target.value;renderGantt();};
document.getElementById("langToggle").onclick=ev=>{
  const btn=ev.target.closest('button');
  if(!btn)return;
  setLang(btn.dataset.lang);
  renderFiltersCustom();
  renderGantt();
  applyStaticI18n();
  updateLangToggle();
};
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")closeModal();
  if(document.activeElement&&document.activeElement.tagName==="INPUT")return;
  if(ev.key==="ArrowLeft")prevMonth();
  else if(ev.key==="ArrowRight")nextMonth();
});
renderFiltersCustom();renderGantt();applyStaticI18n();updateLangToggle();
</script>
</body>
</html>
